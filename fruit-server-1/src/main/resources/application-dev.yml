# ============================================================
# 本地开发环境配置（application-dev.yml）
#
# 这里的账号密码仅供本机开发使用，全部支持用环境变量覆盖：
#   MYSQL_USERNAME / MYSQL_PASSWORD
#   REDIS_HOST / REDIS_PORT / REDIS_PASSWORD
#   RABBITMQ_HOST / RABBITMQ_PORT / RABBITMQ_USERNAME / RABBITMQ_PASSWORD
#   JWT_SECRET
#
# 上线时请新建 application-prod.yml（已在 .gitignore 中排除），
# 通过环境变量注入真实密码与随机密钥，不要复用本文件。
# ============================================================

spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:fruit_fresh}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:sdq1234}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      database: ${REDIS_DATABASE:0}
      password: ${REDIS_PASSWORD:}
      timeout: 5000ms
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    virtual-host: ${RABBITMQ_VHOST:/}
    publisher-confirm-type: correlated
    publisher-returns: true
    listener:
      simple:
        acknowledge-mode: auto
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 1000ms

fruit:
  jwt:
    # 开发用密钥，上线必须通过环境变量 JWT_SECRET 换成随机长字符串（至少32位）
    secret: ${JWT_SECRET:FruitFresh2026SecretKeyForJwtSigning_ChangeMe}
