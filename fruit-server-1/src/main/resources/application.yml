server:
  port: 8080
  servlet:
    context-path: /api

spring:
  application:
    name: fruit-server
  # 默认使用 dev 配置；生产环境通过环境变量 SPRING_PROFILES_ACTIVE=prod 覆盖
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# 业务配置（不含任何敏感信息）
fruit:
  jwt:
    # token 有效期（秒），默认7天
    expire: ${JWT_EXPIRE:604800}
  order:
    # 订单超时未支付自动取消（分钟），RabbitMQ 延迟队列 TTL 直接读取此配置
    timeout-minutes: ${ORDER_TIMEOUT_MINUTES:30}

knife4j:
  enable: true
  setting:
    language: zh_cn
    swagger-model-name: 实体类列表
